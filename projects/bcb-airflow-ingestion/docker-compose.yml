# Airflow 3.3.2 local (LocalExecutor + Postgres). ESCRITO, NÃO EXECUTADO aqui (Docker daemon desligado na máquina de build).
# Uso: `docker compose up airflow-init` e depois `docker compose up -d`; UI em http://localhost:8611 (sem login: auth manager em modo local, ALL_ADMINS).
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    PYTHONPATH: /opt/airflow/src
    BCB_DATA_DIR: /opt/airflow/data
    # Dependências além da imagem base (pandas já vem; pyarrow para o Parquet)
    _PIP_ADDITIONAL_REQUIREMENTS: "pyarrow>=15 requests>=2.31"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: ["airflow", "db", "migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "8611:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-data:
