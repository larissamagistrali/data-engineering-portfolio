name: olist_warehouse
version: "1.0.0"
config-version: 2
profile: olist_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  olist_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: marts
      kpi:
        +schema: gold

data_tests:
  +store_failures: false
